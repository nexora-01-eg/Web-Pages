<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow X — استكشاف الاسم والهوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0908;
    --bg-radial-1: #14100a;
    --surface-1: #151310;
    --surface-2: #1d1a14;
    --surface-3: #262119;
    --border: rgba(196,161,90,.16);
    --border-strong: rgba(196,161,90,.34);
    --gold: #c9a15a;
    --gold-light: #e8cc86;
    --gold-dim: #8a7142;
    --text-primary: #f3ecdc;
    --text-secondary: #b7ab90;
    --text-muted: #6f6553;
    --success-bg: #131f18;
    --success-border: rgba(122,180,140,.4);
    --success-text: #8fc79f;
    --shadow-deep: 0 20px 60px -20px rgba(0,0,0,.7);
    --radius: 14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Tajawal',sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(201,161,90,.09), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(201,161,90,.05), transparent 55%),
      var(--bg);
    color:var(--text-primary);
    min-height:100vh;
    padding:48px 20px 80px;
  }

  .shell{max-width:900px;margin:0 auto}

  /* ---------- Header ---------- */
  .brand-eyebrow{
    display:flex;align-items:center;gap:10px;justify-content:center;
    font-size:11px;letter-spacing:.28em;color:var(--gold-dim);
    text-transform:uppercase;margin-bottom:18px;font-weight:700;
  }
  .brand-eyebrow::before,.brand-eyebrow::after{content:'';width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--border-strong))}
  .brand-eyebrow::after{background:linear-gradient(90deg,var(--border-strong),transparent)}

  h1.title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    text-align:center;
    letter-spacing:.01em;
    background:linear-gradient(180deg,var(--text-primary) 30%,var(--gold-light) 120%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
  }
  .subtitle{
    text-align:center;color:var(--text-secondary);font-size:14.5px;
    max-width:520px;margin:0 auto 40px;line-height:1.9;font-weight:400;
  }

  /* ---------- Elite Draw (signature shuffle) ---------- */
  .draw-panel{
    position:relative;
    border:0.5px solid var(--border-strong);
    border-radius:20px;
    background:linear-gradient(160deg,var(--surface-2),var(--surface-1) 70%);
    padding:26px 26px 22px;
    margin-bottom:34px;
    overflow:hidden;
    box-shadow:var(--shadow-deep);
  }
  .draw-panel::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg at 50% 0%, transparent, rgba(201,161,90,.10), transparent 30%);
    opacity:.6;
  }
  .draw-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;position:relative}
  .draw-head-text .draw-kicker{font-size:10.5px;letter-spacing:.22em;color:var(--gold-dim);text-transform:uppercase;font-weight:700;margin-bottom:4px}
  .draw-head-text h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--text-primary)}
  .draw-btn{
    position:relative;flex-shrink:0;
    width:66px;height:66px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--gold-light), var(--gold) 55%, #7a6231 100%);
    border:2px solid rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 26px -8px rgba(201,161,90,.55), inset 0 1px 1px rgba(255,255,255,.5);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .draw-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 34px -8px rgba(201,161,90,.7), inset 0 1px 1px rgba(255,255,255,.6)}
  .draw-btn:active{transform:scale(.96)}
  .draw-btn svg{width:26px;height:26px;color:#241a08;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
  .draw-btn.spin svg{transform:rotate(360deg)}
  .draw-hint{font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:2px}

  .spotlight{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative;
    min-height:0;max-height:0;opacity:0;overflow:hidden;
    transition:max-height .5s ease, opacity .4s ease, margin-top .4s ease;
  }
  .spotlight.show{max-height:400px;opacity:1;margin-top:6px}
  .spotlight-card{
    position:relative;
    border:1px solid var(--border-strong);
    border-radius:12px;
    padding:16px 14px 14px;
    background:linear-gradient(150deg,var(--surface-3),var(--surface-2));
    text-align:center;
    transform:translateY(6px) scale(.97);opacity:0;
    animation:spotIn .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .spotlight-card:nth-child(2){animation-delay:.08s}
  .spotlight-card:nth-child(3){animation-delay:.16s}
  @keyframes spotIn{to{transform:translateY(0) scale(1);opacity:1}}
  .spotlight-card .corner{position:absolute;width:12px;height:12px;border:1px solid var(--gold-dim);opacity:.6}
  .spotlight-card .corner.tl{top:6px;left:6px;border-left:none;border-top:none}
  .spotlight-card .corner.br{bottom:6px;right:6px;border-right:none;border-bottom:none}
  .spotlight-cat{font-size:9.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .spotlight-name{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:600;color:var(--text-primary);margin-bottom:6px;line-height:1.3}
  .spotlight-sub{font-size:11.5px;color:var(--text-secondary);line-height:1.6}
  .spotlight-pick{
    margin-top:10px;font-size:10.5px;color:var(--gold-dim);font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;
    letter-spacing:.03em;
  }
  .spotlight-pick.picked{color:var(--success-text)}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
  .tab{
    padding:8px 18px;border-radius:20px;border:0.5px solid var(--border);
    background:var(--surface-1);color:var(--text-secondary);
    font-size:12.5px;font-weight:500;cursor:pointer;transition:all .2s;
    font-family:'Tajawal',sans-serif;
  }
  .tab:hover{border-color:var(--border-strong);color:var(--text-primary)}
  .tab.active{background:linear-gradient(135deg,rgba(201,161,90,.22),rgba(201,161,90,.08));color:var(--gold-light);border-color:var(--border-strong)}

  /* ---------- Search ---------- */
  .search-wrap{position:relative;margin-bottom:18px}
  .search-wrap input{
    width:100%;padding:12px 44px 12px 16px;border-radius:var(--radius);
    border:0.5px solid var(--border);background:var(--surface-1);
    color:var(--text-primary);font-size:14px;font-family:'Tajawal',sans-serif;
    transition:border-color .2s;
  }
  .search-wrap input:focus{outline:none;border-color:var(--border-strong)}
  .search-wrap input::placeholder{color:var(--text-muted)}
  .search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

  .count-bar{font-size:12px;color:var(--text-muted);margin-bottom:16px;padding:0 2px}
  .count-bar strong{color:var(--gold-light);font-weight:700}

  /* ---------- Grid / Cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
  .card{
    background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;
    padding:15px 17px;cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);
    position:relative;overflow:hidden;
  }
  .card::after{
    content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;
    background:linear-gradient(135deg,rgba(201,161,90,.08),transparent 60%);
    pointer-events:none;
  }
  .card:hover{border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(0,0,0,.6)}
  .card:hover::after{opacity:1}
  .card.fav{border-color:var(--success-border);background:linear-gradient(160deg,var(--success-bg),var(--surface-1))}
  .card-cat{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
  .card-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:5px;line-height:1.3}
  .card-sub{font-size:12px;color:var(--text-muted);line-height:1.6}
  .card-fav{position:absolute;top:11px;left:11px;font-size:14px;color:var(--gold);opacity:.28;transition:opacity .2s}
  .card:hover .card-fav{opacity:.75}
  .card.fav .card-fav{opacity:1;color:var(--success-text)}

  /* ---------- Fav bar ---------- */
  .fav-bar{
    background:linear-gradient(160deg,var(--success-bg),var(--surface-1));
    border:0.5px solid var(--success-border);border-radius:14px;
    padding:16px 20px;margin-bottom:20px;display:none;
  }
  .fav-bar.show{display:block}
  .fav-bar-title{font-size:12px;font-weight:700;color:var(--success-text);margin-bottom:11px}
  .fav-chips{display:flex;flex-wrap:wrap;gap:7px}
  .fav-chip{
    background:var(--surface-2);border:0.5px solid var(--success-border);border-radius:20px;
    padding:5px 13px;font-size:12px;font-weight:500;color:var(--text-primary);cursor:pointer;
    transition:all .2s;
  }
  .fav-chip:hover{border-color:var(--gold);color:var(--gold-light)}

  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:14px}

  .send-btn{
    margin-top:26px;padding:13px 26px;border-radius:var(--radius);width:100%;
    border:0.5px solid var(--border-strong);
    background:linear-gradient(135deg,var(--gold),#8a7142);
    color:#1a1408;font-size:14px;font-weight:800;cursor:pointer;transition:all .22s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Tajawal',sans-serif;letter-spacing:.02em;
  }
  .send-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(201,161,90,.55)}
  .send-btn:active{transform:translateY(0)}
  .send-btn svg{width:16px;height:16px}

  @media (max-width:560px){
    .spotlight{grid-template-columns:1fr}
    .draw-head{flex-direction:row}
    h1.title{font-size:26px}
  }
</style>
</head>

</div>

const cats = ["الكل", ...new Set(DATA.map(d=>d.cat))];
let activeTab = "الكل";
let favs = new Set();
let drawnPool = [];

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const countEl = document.getElementById('countBar');
const favBar = document.getElementById('favBar');
const favChips = document.getElementById('favChips');
const sendBtn = document.getElementById('sendBtn');
const drawBtn = document.getElementById('drawBtn');
const drawIcon = document.getElementById('drawIcon');
const drawHint = document.getElementById('drawHint');
const spotlightEl = document.getElementById('spotlight');

cats.forEach(c=>{
  const btn = document.createElement('button');
  btn.className = 'tab' + (c===activeTab?' active':'');
  btn.textContent = c;
  btn.onclick = ()=>{ activeTab=c; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); render(); };
  tabsEl.appendChild(btn);
});

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const items = DATA.filter(d=>{
    const matchTab = activeTab==="الكل" || d.cat===activeTab;
    const matchQ = !q || d.name.toLowerCase().includes(q) || d.sub.toLowerCase().includes(q) || d.cat.toLowerCase().includes(q);
    return matchTab && matchQ;
  });
  countEl.innerHTML = `عرض <strong>${items.length}</strong> فكرة من أصل ${DATA.length}`;
  gridEl.innerHTML = '';
  items.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'card' + (favs.has(d.name)?' fav':'');
    card.innerHTML = `<div class="card-cat">${d.cat}</div><div class="card-name">${d.name}</div><div class="card-sub">${d.sub}</div><div class="card-fav">${favs.has(d.name)?'★':'☆'}</div>`;
    card.onclick = ()=>{
      if(favs.has(d.name)) favs.delete(d.name);
      else favs.add(d.name);
      updateFavs(); render();
    };
    gridEl.appendChild(card);
  });
  if(!items.length) gridEl.innerHTML = '<div class="empty">مفيش نتائج — جرب كلمة تانية</div>';
}

function updateFavs(){
  favBar.className = 'fav-bar' + (favs.size?' show':'');
  favChips.innerHTML = '';
  favs.forEach(name=>{
    const chip = document.createElement('div');
    chip.className='fav-chip'; chip.textContent=name;
    chip.onclick=()=>{ favs.delete(name); updateFavs(); render(); renderSpotlight(); };
    favChips.appendChild(chip);
  });
  sendBtn.style.display = favs.size ? 'flex' : 'none';
}

function sendFavs(){
  const list = [...favs].join(' ، ');
  sendPrompt(`اخترت الأسماء والأفكار دي: ${list} — ابدأ بتنفيذها على السايت وغير الاسم والـ concept بناءً على اختياراتي`);
}
sendBtn.onclick = sendFavs;

/* ---------- Elite Draw (premium shuffle) ---------- */
let lastDrawn = [];
function drawPremium(){
  drawBtn.classList.add('spin');
  setTimeout(()=>drawBtn.classList.remove('spin'), 620);

  if(drawnPool.length < 3) drawnPool = [...DATA];
  // shuffle pool
  for(let i=drawnPool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [drawnPool[i],drawnPool[j]] = [drawnPool[j],drawnPool[i]];
  }
  // prefer variety of categories among the 3 picks
  const picks = [];
  const usedCats = new Set();
  for(const item of drawnPool){
    if(picks.length===3) break;
    if(!usedCats.has(item.cat) || drawnPool.length<3){
      picks.push(item); usedCats.add(item.cat);
    }
  }
  while(picks.length<3 && drawnPool.length){
    picks.push(drawnPool[picks.length]);
  }
  drawnPool = drawnPool.filter(d=>!picks.includes(d));
  lastDrawn = picks;
  drawHint.textContent = 'ثلاث أفكار مختارة عشوائيًا من المجموعة — اضغط على النجمة لإضافتها لمفضلتك';
  renderSpotlight();
}

function renderSpotlight(){
  spotlightEl.innerHTML = '';
  if(!lastDrawn.length){ spotlightEl.classList.remove('show'); return; }
  lastDrawn.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'spotlight-card';
    const isFav = favs.has(d.name);
    card.innerHTML = `
      <div class="corner tl"></div><div class="corner br"></div>
      <div class="spotlight-cat">${d.cat}</div>
      <div class="spotlight-name">${d.name}</div>
      <div class="spotlight-sub">${d.sub}</div>
      <div class="spotlight-pick ${isFav?'picked':''}">${isFav?'★ أُضيف للمفضلة':'☆ أضف للمفضلة'}</div>
    `;
    card.querySelector('.spotlight-pick').onclick = ()=>{
      if(favs.has(d.name)) favs.delete(d.name); else favs.add(d.name);
      updateFavs(); render(); renderSpotlight();
    };
    spotlightEl.appendChild(card);
  });
  spotlightEl.classList.add('show');
}

drawBtn.onclick = drawPremium;

render();
</script>
