<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نيكسورا — أعمال الهوية البصرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0b;
    --paper:#f3efe7;
    --paper-dim:#c9c4b8;
    --muted:#8b887f;
    --line:rgba(243,239,231,0.14);
    --accent:#c9a063;
    --accent-soft:rgba(201,160,99,0.35);
    --chrome-h: 64px;
    --film-h: 108px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--ink);
    color:var(--paper);
    height:100%;
    overscroll-behavior:none;
  }
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .lat{ direction:ltr; unicode-bidi:isolate; font-family:'IBM Plex Mono', monospace; }
  .display{ font-family:'Fraunces', serif; }

  /* ---------- top chrome ---------- */
  .topbar{
    position:fixed; inset:0 0 auto 0; height:var(--chrome-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px;
    z-index:40;
    background:linear-gradient(to bottom, rgba(10,10,11,0.92), rgba(10,10,11,0));
    pointer-events:none;
  }
  .topbar .mark{
    font-size:13px; letter-spacing:.12em; color:var(--paper);
    display:flex; align-items:center; gap:10px;
    pointer-events:auto;
  }
  .topbar .mark .dot{ width:6px;height:6px;border-radius:50%; background:var(--accent); transition:background .5s ease; }
  .topbar .counter{
    font-size:12px; color:var(--muted); letter-spacing:.05em;
    pointer-events:auto;
  }
  .topbar .counter b{ color:var(--paper); font-weight:500; }

  .progress-track{
    position:fixed; top:var(--chrome-h); left:0; right:0; height:2px;
    background:var(--line); z-index:40;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--accent);
    transition:width .55s cubic-bezier(.65,0,.35,1), background .5s ease;
  }

  /* ---------- rail ---------- */
  .rail{
    display:flex;
    height:100vh;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .rail::-webkit-scrollbar{ display:none; }
  .rail{ scrollbar-width:none; }

  .slide{
    flex:0 0 100vw;
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- cover slide ---------- */
  .cover{
    justify-content:center;
    align-items:flex-start;
    padding:0 8vw;
    background:
      radial-gradient(ellipse 900px 500px at 78% 18%, rgba(201,160,99,0.10), transparent 60%),
      var(--ink);
  }
  .cover .eyebrow{
    font-size:13px; letter-spacing:.16em; color:var(--accent);
    margin-bottom:22px;
  }
  .cover h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(34px, 6vw, 76px);
    line-height:1.12;
    margin:0 0 26px;
    max-width:14ch;
  }
  .cover p{
    font-size:clamp(15px,1.6vw,19px);
    color:var(--paper-dim);
    max-width:46ch;
    line-height:1.8;
    margin:0 0 42px;
  }
  .cover .cta{
    display:inline-flex; align-items:center; gap:12px;
    padding:15px 26px;
    border:1px solid var(--line);
    border-radius:2px;
    font-size:14px; color:var(--paper);
    background:transparent;
    cursor:pointer;
    transition:border-color .3s ease, background .3s ease;
  }
  .cover .cta:hover{ border-color:var(--accent); background:rgba(201,160,99,0.08); }
  .cover .cta svg{ width:16px; height:16px; transform:rotate(180deg); transition:transform .3s ease; }
  .cover .cta:hover svg{ transform:rotate(180deg) translateX(4px); }

  .cover .index-list{
    position:absolute; left:8vw; bottom:calc(var(--film-h) + 64px);
    display:none;
  }
  @media (min-width:900px){
    .cover .index-list{ display:flex; flex-direction:column; gap:6px; }
    .cover .index-list span{ font-size:11px; color:var(--muted); letter-spacing:.04em; }
  }

  /* ---------- project slide ---------- */
  .project .frame{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    padding: calc(var(--chrome-h) + 34px) 24px 26px;
  }
  .project .frame::-webkit-scrollbar{ width:6px; }
  .project .frame::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .project img{
    width:min(900px, 90vw);
    height:auto;
    display:block;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7);
    cursor:zoom-in;
    transition:width .35s ease;
  }
  .project.zoomed img{ width:min(1500px, 96vw); cursor:zoom-out; }

  .caption{
    flex:0 0 auto;
    padding:16px 6vw 20px;
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    border-top:1px solid var(--line);
    background:linear-gradient(to top, rgba(10,10,11,0.6), transparent);
  }
  .caption .titles{ display:flex; flex-direction:column; gap:6px; }
  .caption .cat{ font-size:12px; color:var(--muted); letter-spacing:.06em; }
  .caption .name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(22px,3vw,34px);
    color:var(--paper);
    direction:ltr; unicode-bidi:isolate;
  }
  .caption .tagline{ font-size:13px; color:var(--paper-dim); direction:ltr; unicode-bidi:isolate; }

  .swatches{ display:flex; gap:8px; align-items:center; }
  .swatches i{
    width:18px;height:18px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.15);
    display:block;
  }

  /* ---------- bottom filmstrip ---------- */
  .bottombar{
    position:fixed; inset:auto 0 0 0; height:var(--film-h);
    display:flex; align-items:center; gap:10px;
    padding:0 14px;
    background:linear-gradient(to top, rgba(10,10,11,0.95), rgba(10,10,11,0.75));
    border-top:1px solid var(--line);
    z-index:40;
  }
  .navbtn{
    flex:0 0 auto;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .25s ease, background .25s ease, transform .2s ease;
  }
  .navbtn:hover{ border-color:var(--accent); background:rgba(201,160,99,0.08); }
  .navbtn:active{ transform:scale(.94); }
  .navbtn svg{ width:16px;height:16px; }
  .navbtn.next svg{ transform:rotate(180deg); }

  .filmstrip{
    flex:1;
    display:flex; gap:8px;
    overflow-x:auto;
    scroll-behavior:smooth;
    height:100%;
    align-items:center;
    padding:0 2px;
  }
  .filmstrip::-webkit-scrollbar{ display:none; }
  .filmstrip{ scrollbar-width:none; }

  .thumb{
    flex:0 0 auto;
    width:64px; height:80px;
    border-radius:2px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    opacity:.5;
    border:1.5px solid transparent;
    transition:opacity .3s ease, border-color .3s ease, transform .25s ease;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb.cover-thumb{
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.03);
  }
  .thumb.cover-thumb span{ font-size:10px; color:var(--muted); }
  .thumb.active{ opacity:1; border-color:var(--accent); transform:translateY(-3px); }
  .thumb:hover{ opacity:.85; }

  @media (max-width:640px){
    :root{ --film-h:88px; }
    .thumb{ width:48px; height:60px; }
    .navbtn{ width:34px; height:34px; }
    .caption{ padding:14px 5vw 16px; }
    .topbar{ padding:0 16px; }
    .project .frame{ padding-top:calc(var(--chrome-h) + 18px); }
  }

  .sr-only{
    position:absolute; width:1px;height:1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .rail{ scroll-behavior:auto; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="mark"><span class="dot"></span> استوديو نيكسورا</div>
    <div class="counter"><b class="lat" id="curIndex">00</b> <span class="lat">/ 11</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <main class="rail" id="rail">

    <section class="slide cover" data-accent="#c9a063">
      <div class="eyebrow">أعمال الهوية البصرية — ٢٠٢٦</div>
      <h1>هويات بصرية كاملة، من الفكرة للتطبيق</h1>
      <p>مجموعة من ١١ نظام هوية بصرية متكامل — شعار، ألوان، خطوط، وتطبيقات حقيقية على مواقع، عبوات، وبطاقات أعمال. مرّر لليمين أو استخدم الأسهم تحت للتنقل بين الأعمال.</p>
      <button class="cta" id="startBtn">
        ابدأ التصفح
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="index-list">
        <span class="lat">01 — VELORIS</span>
        <span class="lat">06 — AURIXA</span>
        <span class="lat">11 — NOCTURNE</span>
      </div>
    </section>

    <!-- projects injected by JS -->

  </main>

  <div class="bottombar">
    <button class="navbtn prev" id="prevBtn" aria-label="السابق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="filmstrip" id="filmstrip"></div>
    <button class="navbtn next" id="nextBtn" aria-label="التالي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>

<script>
const projects = [
  {
    id:"veloris", name:"VELORIS", cat:"ساعات فاخرة", tagline:"Time Refined.",
    accent:"#c9a063",
    swatches:["#0B1320","#1D3557","#C9A063","#BDBDBD","#F4F4F4"]
  },
  {
    id:"lumora", name:"LUMORA", cat:"عناية طبيعية بالبشرة", tagline:"Clean. Conscious. Glowing.",
    accent:"#7f8f66",
    swatches:["#2E3B2F","#6B7A64","#A7AE6B","#DAD2C1","#F5F4EF"]
  },
  {
    id:"rivana", name:"RIVANA", cat:"مطعم متوسطي", tagline:"Authentic Flavors. Modern Experience.",
    accent:"#a8443c",
    swatches:["#6B1E1E","#C49A6C","#F2ECE2","#1D1D1B","#8D7A63"]
  },
  {
    id:"alterra", name:"ALTERRA", cat:"معدات ونمط حياة خارجي", tagline:"Gear for What's Next.",
    accent:"#d6a24c",
    swatches:["#2F4F38","#EDE7D6","#A89A7A","#1F1F1F","#D6A24C"]
  },
  {
    id:"elevora", name:"ELEVORA", cat:"طاقة متجددة", tagline:"Energy for a Stronger Tomorrow.",
    accent:"#6fae4e",
    swatches:["#1E3D2E","#4CAF50","#A6C96A","#2B2F33","#E6E7E8"]
  },
  {
    id:"aurixa", name:"AURIXA", cat:"تقنية وذكاء اصطناعي", tagline:"AI Solutions for the Future.",
    accent:"#5b7cf0",
    swatches:["#0A0E17","#2563EB","#7C3AED","#14BBA6","#F2F4F7"]
  },
  {
    id:"nexora", name:"NEXORA", cat:"هوية مؤسسية متعددة الصناعات", tagline:"Built for Every Industry.",
    accent:"#d4a253",
    swatches:["#0E1520","#283D2E","#5B6361","#D4A253","#F9F8F5"]
  },
  {
    id:"velora", name:"VELORA", cat:"أزياء فاخرة", tagline:"Timeless Design. True Luxury, Naturally.",
    accent:"#b08a63",
    swatches:["#F7F4EF","#E6DDD1","#B08A63","#0D0D0D","#1B181B"]
  },
  {
    id:"wavora", name:"WAVORA", cat:"سيرف ونمط حياة ساحلي", tagline:"Ride Natural. Live Free.",
    accent:"#5e7f6b",
    swatches:["#1F3D34","#5E7F6B","#E6DCC6","#F7F5F1","#0D0D0D"]
  },
  {
    id:"aureo", name:"AURÉO", cat:"تحميص قهوة مختصة", tagline:"Slow Roasted. Simply Exceptional.",
    accent:"#a4643f",
    swatches:["#1D1816","#6B4E3D","#D7C5AD","#F6F1E9","#A4643F"]
  },
  {
    id:"nocturne", name:"NOCTURNE", cat:"ساعات معاصرة", tagline:"Time Reimagined.",
    accent:"#d4af37",
    swatches:["#0A0A0A","#1C1C1E","#D4AF37","#F5F5F7","#BEBE93"]
  }
];

const rail = document.getElementById('rail');
const filmstrip = document.getElementById('filmstrip');
const curIndexEl = document.getElementById('curIndex');
const progressFill = document.getElementById('progressFill');

// build project slides
projects.forEach((p, i) => {
  const section = document.createElement('section');
  section.className = 'slide project';
  section.dataset.accent = p.accent;
  section.dataset.index = i + 1;
  section.innerHTML = `
    <div class="frame">
      <img src="images/${p.id}.jpg" alt="${p.name} — ${p.cat}" loading="${i < 2 ? 'eager' : 'lazy'}">
    </div>
    <div class="caption">
      <div class="titles">
        <span class="cat">${p.cat}</span>
        <span class="name lat">${p.name}</span>
        <span class="tagline lat">${p.tagline}</span>
      </div>
      <div class="swatches">
        ${p.swatches.map(c => `<i style="background:${c}"></i>`).join('')}
      </div>
    </div>
  `;
  rail.appendChild(section);

  const img = section.querySelector('img');
  img.addEventListener('click', () => section.classList.toggle('zoomed'));

  // filmstrip thumb
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  thumb.dataset.target = i + 1;
  thumb.innerHTML = `<img src="images/thumb_${p.id}.jpg" alt="${p.name}" loading="lazy">`;
  thumb.addEventListener('click', () => goTo(i + 1));
  filmstrip.appendChild(thumb);
});

// cover thumb prepended
const coverThumb = document.createElement('div');
coverThumb.className = 'thumb cover-thumb';
coverThumb.dataset.target = 0;
coverThumb.innerHTML = `<span class="lat">COVER</span>`;
coverThumb.addEventListener('click', () => goTo(0));
filmstrip.insertBefore(coverThumb, filmstrip.firstChild);

const slides = Array.from(document.querySelectorAll('.slide'));
const thumbs = Array.from(document.querySelectorAll('.thumb'));

function goTo(index){
  slides[index].scrollIntoView({ behavior:'smooth', inline:'start', block:'nearest' });
}

document.getElementById('startBtn').addEventListener('click', () => goTo(1));
document.getElementById('prevBtn').addEventListener('click', () => {
  const cur = currentIndex();
  goTo(Math.max(0, cur - 1));
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const cur = currentIndex();
  goTo(Math.min(slides.length - 1, cur + 1));
});

function currentIndex(){
  const scrollLeft = rail.scrollLeft;
  const w = rail.clientWidth;
  return Math.round(scrollLeft / w);
}

function updateChrome(){
  const idx = currentIndex();
  const clamped = Math.max(0, Math.min(idx, slides.length - 1));
  const accent = slides[clamped].dataset.accent || '#c9a063';
  document.documentElement.style.setProperty('--accent', accent);

  const projectNum = clamped === 0 ? 0 : clamped;
  curIndexEl.textContent = String(projectNum).padStart(2,'0');
  progressFill.style.width = (clamped / (slides.length - 1) * 100) + '%';

  thumbs.forEach(t => t.classList.toggle('active', Number(t.dataset.target) === clamped));
  const activeThumb = thumbs[clamped];
  if (activeThumb) activeThumb.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

let ticking = false;
rail.addEventListener('scroll', () => {
  if (!ticking){
    requestAnimationFrame(() => { updateChrome(); ticking = false; });
    ticking = true;
  }
});

window.addEventListener('keydown', (e) => {
  if (['ArrowRight','ArrowDown'].includes(e.key)){
    e.preventDefault();
    goTo(Math.min(slides.length - 1, currentIndex() + 1));
  } else if (['ArrowLeft','ArrowUp'].includes(e.key)){
    e.preventDefault();
    goTo(Math.max(0, currentIndex() - 1));
  } else if (e.key === 'Escape'){
    document.querySelectorAll('.project.zoomed').forEach(s => s.classList.remove('zoomed'));
  }
});

updateChrome();
</script>
</body>
</html>
